# Local development stack: PHP-FPM + nginx + PostgreSQL + Redis + queue worker + scheduler + Mailpit.
#
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
#   API:      http://localhost:8000          Docs: http://localhost:8000/docs/api
#   Mailpit:  http://localhost:8025          (all outgoing email is caught here)
#
# Docker is optional: the app also runs natively (see README). Your source is bind-mounted, so edits
# apply immediately; the same .env works with and without Docker (service hosts are overridden below).

name: shop-dev

x-app: &app
  build:
    context: .
    target: dev
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment: &app-env
    APP_ENV: local
    COMPOSER_HOME: /tmp/composer
    APP_URL: http://localhost:8000
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: shop
    DB_USERNAME: shop
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PASSWORD: "null"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
    FRONTEND_URL: ${FRONTEND_URL:-http://app.localhost:3000}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *app
    command: php-fpm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:work redis --queue=default --sleep=1 --tries=3 --backoff=10
    depends_on:
      - app

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      # Same password as DB_PASSWORD in .env, so the natively run app and the containers use one database.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432" # this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP: the app sends here (MAIL_HOST=127.0.0.1, MAIL_PORT=1025 when running natively)
      - "8025:8025" # web inbox

volumes:
  pgdata:
