# API server: static public/ files plus FastCGI to PHP-FPM.
# TLS and the public hostname are handled in front of this (Cloudflare / a reverse proxy).

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Media uploads are limited to 5 MB by the app; keep a little headroom.
    client_max_body_size 8m;

    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Behind Cloudflare, uncomment and list its ranges (https://www.cloudflare.com/ips/) so the
    # real client IP reaches Laravel's rate limiter:
    #   set_real_ip_from 173.245.48.0/20;
    #   real_ip_header CF-Connecting-IP;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never serve dotfiles (.env, .git ...) or anything outside public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
